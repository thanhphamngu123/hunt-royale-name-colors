<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunt Royale - Bảng Xem Màu Tên Chạy (Name Color Viewer)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Lilita+One&family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #0B121E;
    background-image: 
      radial-gradient(circle at 50% 0%, #1A3960 0%, #0B121E 70%),
      linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.7) 100%);
    background-attachment: fixed;
    color: #FFFFFF;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #0B121E;
  }
  ::-webkit-scrollbar-thumb {
    background: #23456F;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #3264A0;
  }

  /* Sticky Top Header */
  header {
    text-align: center;
    padding: 20px 16px 14px;
    background: rgba(11, 18, 30, 0.92);
    border-bottom: 2px solid #1C385C;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
  }

  h1 {
    font-family: 'Titan One', 'Lilita One', 'Arial Rounded MT Bold', cursive, sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    color: #FFD428;
    text-shadow: 
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000,
       0 4px 10px rgba(0,0,0,0.9);
    margin-bottom: 12px;
  }

  /* Controls Panel */
  .control-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 960px;
    margin: 0 auto;
  }

  .input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #101F33;
    border: 2px solid #244673;
    border-radius: 10px;
    padding: 6px 12px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    transition: border-color 0.2s;
  }

  .input-box:focus-within {
    border-color: #00D2FF;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
  }

  .input-box label {
    font-size: 13px;
    font-weight: 700;
    color: #7AA2D0;
    white-space: nowrap;
  }

  .input-box input {
    background: transparent;
    border: none;
    outline: none;
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 700;
  }

  .input-name {
    width: 150px;
  }

  .input-search {
    width: 140px;
  }

  .preset-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #E2E8F0;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #FFF;
  }

  .select-box {
    background: #101F33;
    border: 2px solid #244673;
    border-radius: 10px;
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
  }

  /* Status Counter */
  .status-text {
    margin-top: 10px;
    font-size: 13px;
    color: #8EABC9;
    font-weight: 600;
  }

  /* Grid of Color Bars */
  .container {
    max-width: 1250px;
    margin: 24px auto 0;
    padding: 0 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 16px;
  }

  /* ============================================================== */
  /* GAME SLOT CONTAINER (Mô phỏng khe cắm sảnh game Hunt Royale)    */
  /* ============================================================== */
  .game-slot {
    background: linear-gradient(180deg, #184A80 0%, #0F325A 100%);
    border: 2px solid #2B75C8;
    border-top: 2px solid #58A6FF;
    border-bottom: 2px solid #0B213A;
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 
      0 4px 14px rgba(0, 0, 0, 0.55),
      inset 0 1px 2px rgba(255, 255, 255, 0.3),
      inset 0 -2px 6px rgba(0, 0, 0, 0.6);
    position: relative;
    min-height: 105px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .game-slot:hover {
    border-color: #64B5F6;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
  }

  .game-slot-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .slot-id {
    font-family: 'Consolas', monospace;
    font-size: 13px;
    font-weight: 800;
    color: #FFE600;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 230, 0, 0.4);
    padding: 2px 8px;
    border-radius: 6px;
    text-shadow: 0 1px 2px #000;
  }

  .slot-info {
    font-size: 11px;
    font-weight: 700;
    color: #A0C2E8;
    background: rgba(0, 0, 0, 0.3);
    padding: 2px 8px;
    border-radius: 6px;
  }

  /* Inner Arena */
  .text-arena {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.28);
    border-radius: 8px;
    padding: 10px 8px;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
    min-height: 52px;
    overflow: hidden;
    white-space: nowrap;
  }

  /* ============================================================== */
  /* INDIVIDUAL CHARACTER STYLING - CHUẨN XÁC THEO GAME            */
  /* ============================================================== */
  .hr-char {
    display: inline-block;
    font-family: 'Titan One', 'Lilita One', 'Fredoka', 'Arial Rounded MT Bold', cursive, sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1;
    
    /* Viền đen thanh mảnh, tinh tế, không bị dày */
    -webkit-text-stroke: 0.5px #000000;
    text-shadow: 
      -1px -1px 0 #000000,  
       1px -1px 0 #000000,
      -1px  1px 0 #000000,
       1px  1px 0 #000000,
       0px  1.5px 2px rgba(0, 0, 0, 0.5);
    
    /* Keyframe animation chạy mượt trên GPU */
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-direction: reverse;
  }

  /* Tùy chỉnh độ dày viền */
  .border-ultrathin .hr-char {
    -webkit-text-stroke: 0px transparent !important;
    text-shadow: 
      -1px -1px 0 #000000,  
       1px -1px 0 #000000,
      -1px  1px 0 #000000,
       1px  1px 0 #000000 !important;
  }

  .border-medium .hr-char {
    -webkit-text-stroke: 1.0px #000000 !important;
    text-shadow: 
      -1.2px -1.2px 0 #000000,  
       1.2px -1.2px 0 #000000,
      -1.2px  1.2px 0 #000000,
       1.2px  1.2px 0 #000000,
       0px 2px 3px rgba(0,0,0,0.7) !important;
  }

  .border-none .hr-char {
    -webkit-text-stroke: 0px transparent !important;
    text-shadow: none !important;
  }

  .dir-forward .hr-char {
    animation-direction: normal !important;
  }

  .paused .hr-char {
    animation-play-state: paused !important;
  }

  /* Mini palette bar */
  .palette-bar {
    height: 4px;
    border-radius: 2px;
    margin-top: 8px;
    border: 1px solid rgba(0, 0, 0, 0.5);
    opacity: 0.85;
  }

  @media (max-width: 600px) {
    .container { grid-template-columns: 1fr; }
    .input-name, .input-search { width: 100%; }
    .control-row { flex-direction: column; }
  }

      <div style="display:flex; gap:3px;">

    <select class="select-box" id="speedSelect" onchange="onSpeedChange(this.value)">

      <option value="1.5">Tốc độ: Nhanh hơn (1.5x)</option>
      <option value="pause">Tạm dừng chuyển động</option>
    </select>

    <!-- Hướng chuyển động -->
    <select class="select-box" id="dirSelect" onchange="onDirChange(this.value)">
      <option value="ltr" selected>Chạy: Trái ➔ Phải (Chuẩn Game)</option>
      <option value="rtl">Chạy: Phải ➔ Trái</option>
    </select>

    <!-- Độ dày viền -->
    <select class="select-box" id="borderSelect" onchange="onBorderChange(this.value)">
      <option value="thin" selected>Viền: Mỏng (Chuẩn Đẹp)</option>
      <option value="ultrathin">Viền: Siêu Mỏng (1px)</option>
      <option value="medium">Viền: Vừa</option>
      <option value="none">Viền: Không Viền</option>
    </select>
  </div>

  <div class="status-text" id="statusCount">Đang hiển thị 293 / 293 màu tên</div>
</header>

  let currentName = 'Guest 1174';
  let speedScale = 1.0;
  let isPaused = false;
  let query = '';

  window.addEventListener('DOMContentLoaded', () => {
    buildCards();
  });

  function setPreset(name) {
    document.getElementById('nameInput').value = name;
    onNameChange(name);
  }

  function onNameChange(val) {
    currentName = val.trim() || 'Player';
    document.querySelectorAll('.game-slot').forEach(card => {
      renderTextForCard(card);
    });
  }

  function onSearchChange(val) {
    query = val.trim().toLowerCase();
    buildCards();
  }

  function onSpeedChange(val) {
    if (val === 'pause') {
      isPaused = true;
      document.body.classList.add('paused');
    } else {
      isPaused = false;
      document.body.classList.remove('paused');
      speedScale = parseFloat(val);
      document.querySelectorAll('.game-slot').forEach(card => {
        renderTextForCard(card);
      });
    }
  }

  function onDirChange(val) {
    if (val === 'rtl') {
      document.body.classList.add('dir-forward');
    } else {
      document.body.classList.remove('dir-forward');
    }
  }

  function onBorderChange(val) {
    document.body.classList.remove('border-ultrathin', 'border-medium', 'border-none');
    if (val !== 'thin') {
      document.body.classList.add('border-' + val);
    }
  }

  function renderTextForCard(card) {
    const isGrad = card.dataset.isGrad === 'true';
    const dur = parseFloat(card.dataset.duration) / speedScale;
    const animName = card.dataset.anim;
    const solidHex = card.dataset.solid;
    const arena = card.querySelector('.text-arena');

    const chars = Array.from(currentName);
    const N = chars.length;

    let html = '';
    chars.forEach((ch, i) => {
      const displayChar = (ch === ' ') ? '&nbsp;' : ch;
      if (!isGrad) {
        html += `<span class="hr-char" style="color: ${solidHex};">${displayChar}</span>`;
      } else {
        // C# formula: delay = (i / (N + 1)) * duration
        const delay = ((i / (N + 1)) * dur).toFixed(3);
        html += `<span class="hr-char" style="animation-name: ${animName}; animation-duration: ${dur.toFixed(3)}s; animation-delay: -${delay}s;">${displayChar}</span>`;
      }
    });

    arena.innerHTML = html;
  }

  function buildCards() {
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = '';

    const filtered = colors.filter(c => {
      if (!query) return true;
      return c.id.toString().includes(query);
    });

    document.getElementById('statusCount').textContent = `Đang hiển thị ${filtered.length} / ${colors.length} màu tên`;

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #7DA3CD;">
          <h3 style="color:#FFF; font-size:18px; margin-bottom:8px;">Không tìm thấy màu ID "${query}"</h3>
          <p>Vui lòng nhập số ID khác từ -1 đến 291.</p>
        </div>`;
      return;
    }

    filtered.forEach(c => {
      const slot = document.createElement('div');
      slot.className = 'game-slot';
      slot.dataset.id = c.id;
      slot.dataset.isGrad = c.is_grad;
      slot.dataset.duration = c.duration;
      slot.dataset.anim = c.anim_name;
      slot.dataset.solid = c.solid_hex;

      const infoTag = c.is_grad ? `${c.num_colors} Màu • Tốc độ ${c.speed}s` : `Màu Đơn Sắc (${c.solid_hex})`;

      slot.innerHTML = `
        <div class="game-slot-header">
          <span class="slot-id">ID ${c.id}</span>
          <span class="slot-info">${infoTag}</span>
        </div>
        <div class="text-arena"></div>
        <div class="palette-bar" style="background: ${c.palette_css};"></div>
      `;

      renderTextForCard(slot);
      grid.appendChild(slot);
    });
  }
</script>
